# Blend in or Bust on the home server. Listens only on this machine; the Cloudflare Tunnel
# sends blend-in-or-bust.pifractal.com here.
services:
  server:
    build:
      context: ..
      dockerfile: home-server/Dockerfile
    container_name: game-blend-in-or-bust
    restart: unless-stopped
    ports:
      - "127.0.0.1:8343:3000"
    mem_limit: 512m
    logging:
      options:
        max-size: "5m"
        max-file: "2"
